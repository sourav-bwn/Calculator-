<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <style>
       .calculator {
            width: 200px;
            margin: 0 auto;
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }
        input {
            box-sizing: border-box;
            width: 100%;
            margin-bottom: 10px;
            padding: 5px;
        }
        button {
            width: 40px;
            height: 30px;
            margin: 2px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="result" readonly>
        <br>
        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button onclick="appendOperator('+')">+</button>
        <br>
        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button onclick="appendOperator('-')">-</button>
        <br>
        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button onclick="appendOperator('*')">*</button>
        <br>
        <button onclick="appendNumber('0')">0</button>
        <button onclick="appendDecimal()">.</button>
        <button onclick="calculate()">=</button>
        <button onclick="appendOperator('/')">/</button>
        <br>
        <button onclick="clearResult()">Clear</button>
    </div>

    <script>
        let result = document.getElementById('result');

        function appendNumber(number) {
            if (result.value === 'Error') result.value = '';
            result.value += number;
        }

        function appendOperator(operator) {
            if (result.value === 'Error') return;
            // Replace an unfinished binary operator, but retain unary minus for negatives.
            if (operator !== '-' && /[+*/]$/.test(result.value)) {
                result.value = result.value.slice(0, -1) + operator;
            } else result.value += operator;
        }

        function appendDecimal() {
            if (result.value === 'Error') result.value = '';
            // Only one decimal point is valid in each number, not one per expression.
            const match = /(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/.exec(result.value);
            const currentNumber = match ? match[0] : '';
            // A displayed exponent is a complete result, not an editable decimal.
            if (/[.eE]/.test(currentNumber)) return;
            result.value += currentNumber ? '.' : '0.';
        }

        function clearResult() {
            result.value = '';
        }

        document.addEventListener('keydown', (event) => {
            if (event.ctrlKey || event.metaKey || event.altKey) return;
            if (/^[0-9]$/.test(event.key)) appendNumber(event.key);
            else if (/^[+*/-]$/.test(event.key)) appendOperator(event.key);
            else if (event.key === '.') appendDecimal();
            else if (event.key === 'Enter' || event.key === '=') calculate();
            else if (event.key === 'Escape') clearResult();
            else if (event.key === 'Backspace') {
                result.value = result.value === 'Error' ? '' : result.value.slice(0, -1);
            } else return;
            event.preventDefault();
        });

        // Accept only calculator numbers and operators, never JavaScript code.
        function evaluateExpression(input) {
            let position = 0;

            function number() {
                const match = /^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/.exec(input.slice(position));
                if (!match) throw new Error('Expected a number');
                position += match[0].length;
                return Number(match[0]);
            }

            function factor() {
                if (input[position] === '-') {
                    position++;
                    return -factor();
                }
                if (input[position] === '+') {
                    position++;
                    return factor();
                }
                return number();
            }

            function term() {
                let value = factor();
                while (input[position] === '*' || input[position] === '/') {
                    const operator = input[position++];
                    const right = factor();
                    value = operator === '*' ? value * right : value / right;
                }
                return value;
            }

            function expression() {
                let value = term();
                while (input[position] === '+' || input[position] === '-') {
                    const operator = input[position++];
                    const right = term();
                    value = operator === '+' ? value + right : value - right;
                }
                return value;
            }

            const value = expression();
            if (position !== input.length || !Number.isFinite(value)) {
                throw new Error('Invalid expression');
            }
            return value;
        }

        function calculate() {
            if (!result.value) return;
            try {
                result.value = String(evaluateExpression(result.value));
            } catch (error) {
                result.value = 'Error';
            }
        }
    </script>
</body>
</html>
